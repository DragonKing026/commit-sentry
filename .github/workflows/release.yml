---
# Release on a `v*` tag: source archive + SHA256SUMS, SLSA level 3 provenance, GitHub release.
# Verify a download with slsa-verifier (see README "Releases").
name: release

"on":
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
      version: ${{ steps.version.outputs.version }}
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Version from tag
        id: version
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::tag $GITHUB_REF_NAME is not vX.Y.Z" >&2
            exit 1
          fi
          version="${BASH_REMATCH[1]}"
          manifest=$(python3 -c 'import json; print(json.load(open(".claude-plugin/plugin.json"))["version"])')
          if [[ "$manifest" != "$version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match plugin.json version $manifest" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Source archive and checksums
        id: hash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir dist
          git archive --format=tar.gz --prefix="commit-sentry-${VERSION}/" \
            -o "dist/commit-sentry-${VERSION}.tar.gz" "$GITHUB_SHA"
          cd dist
          sha256sum "commit-sentry-${VERSION}.tar.gz" > SHA256SUMS
          cat SHA256SUMS
          echo "hashes=$(base64 -w0 SHA256SUMS)" >> "$GITHUB_OUTPUT"
      # v7.0.2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 5

  provenance:
    needs: [build]
    permissions:
      actions: read # to read the workflow path
      id-token: write # to sign the provenance
      contents: write # requested by the generator's upload-assets job (not used here: upload-assets is false)
    # Reusable workflows of slsa-github-generator must be referenced by tag, not by SHA:
    # https://github.com/slsa-framework/slsa-github-generator#referencing-slsa-builders-and-generators
    # (Scorecard exempts it), hence the zizmor ignore below.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0  # zizmor: ignore[unpinned-uses]
    with:
      base64-subjects: ${{ needs.build.outputs.hashes }}
      upload-assets: false

  release:
    needs: [build, provenance]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # to create the release
    steps:
      # v8.0.2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: dist
          path: dist
      # v8.0.2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ needs.provenance.outputs.provenance-name }}
          path: dist
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
          PROVENANCE: ${{ needs.provenance.outputs.provenance-name }}
        run: |
          cd dist
          sha256sum -c SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "commit-sentry ${VERSION}" \
            --notes "Source archive, SHA256SUMS and SLSA provenance (${PROVENANCE}). Verify with slsa-verifier; see README." \
            "commit-sentry-${VERSION}.tar.gz" SHA256SUMS "$PROVENANCE"
